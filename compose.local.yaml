services:
  traefik:
    image: traefik:v3.5
    container_name: sivaxi-local-traefik
    restart: unless-stopped
    command:
      - "--entrypoints.web.address=:4200"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--api.dashboard=false"
    ports:
      - "4200:4200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./traefik.local.yml:/etc/traefik/dynamic.yml:ro"
