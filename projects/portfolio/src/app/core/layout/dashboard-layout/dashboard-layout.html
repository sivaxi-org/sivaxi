
<div class="min-h-screen bg-bg-base text-text-primary">
  <div class="flex min-h-screen">
    <!-- Mobile overlay -->
    @if (mobileMenuOpen) {
      <button
        type="button"
        aria-label="Close navigation"
        class="fixed inset-0 z-110 bg-black/40 backdrop-blur-[2px] lg:hidden"
        (click)="closeMobileMenu()"
      ></button>
    }

    <!-- Sidebar -->
    <aside
      id="dashboard-sidebar"
      class="fixed inset-y-0 left-0 z-120 flex h-screen w-64 shrink-0 flex-col overflow-hidden border-r border-glass-border-soft bg-bg-elev transition-transform duration-300 ease-out lg:sticky lg:top-0 lg:z-auto lg:translate-x-0"
      [class.-translate-x-full]="!mobileMenuOpen"
      [class.translate-x-0]="mobileMenuOpen"
    >
      <!-- Brand -->
      <div
        class="flex h-16 shrink-0 items-center justify-between border-b border-glass-border-soft px-5"
      >
        <a
          routerLink="/dashboard"
          class="flex min-w-0 items-center gap-3 rounded-lg focus-visible:outline-2 focus-visible:outline-accent-1"
          aria-label="Sivaxi dashboard home"
          (click)="closeMobileMenu()"
        >
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-glass-border-soft bg-glass-fill-strong text-sm font-bold text-accent"
          >
            S
          </div>

          <div class="min-w-0">
            <h1 class="text-sm font-semibold text-text-primary">Sivaxi</h1>
            <p class="truncate text-[11px] text-text-muted">
              Portfolio Management
            </p>
          </div>
        </a>

        <button
          type="button"
          class="rounded-lg p-2 text-text-muted transition hover:bg-glass-fill hover:text-text-primary focus-visible:outline-2 focus-visible:outline-accent-1 lg:hidden"
          aria-label="Close navigation"
          (click)="closeMobileMenu()"
        >
          <iconify-icon
            icon="lucide:x"
            width="18"
            height="18"
            aria-hidden="true"
          />
        </button>
      </div>

      <!-- Data-driven navigation -->
      <nav
        class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden p-3"
        aria-label="Dashboard navigation"
      >
        @for (group of navGroups; track group.title) {
          <section class="mb-6">
            <h2
              class="px-3 pb-2 pt-3 text-[11px] font-medium uppercase tracking-[0.12em] text-text-faint"
            >
              {{ group.title }}
            </h2>

            <div class="space-y-1">
              @for (item of group.items; track item.route) {
                @if (item.external) {
                  <!-- Public portfolio preview: open in a new tab -->
                  <a
                    [href]="item.route"
                    target="_blank"
                    rel="noopener noreferrer"
                    (click)="closeMobileMenu()"
                    class="flex items-center gap-3 rounded-xl border border-transparent px-3 py-2.5 text-sm text-text-muted transition-colors hover:bg-glass-fill hover:text-text-primary focus-visible:outline-2 focus-visible:outline-accent-1"
                  >
                    <iconify-icon
                      [attr.icon]="item.icon"
                      width="18"
                      height="18"
                      aria-hidden="true"
                    />
                    <span>{{ item.label }}</span>
                    <iconify-icon
                      icon="lucide:arrow-up-right"
                      width="14"
                      height="14"
                      class="ml-auto shrink-0 opacity-60"
                      aria-hidden="true"
                    />
                  </a>
                } @else {
                  <!-- Internal dashboard navigation -->
                  <a
                    [routerLink]="item.route"
                    routerLinkActive="!border-glass-border !bg-glass-fill-strong !text-text-primary"
                    [routerLinkActiveOptions]="{
                      exact: item.exact ?? false
                    }"
                    (click)="closeMobileMenu()"
                    class="flex items-center gap-3 rounded-xl border border-transparent px-3 py-2.5 text-sm text-text-muted transition-colors hover:bg-glass-fill hover:text-text-primary focus-visible:outline-2 focus-visible:outline-accent-1"
                  >
                    <iconify-icon
                      [attr.icon]="item.icon"
                      width="18"
                      height="18"
                      aria-hidden="true"
                    />
                    <span>{{ item.label }}</span>
                  </a>
                }
              }
            </div>
          </section>
        }
      </nav>

      <!-- Sidebar footer -->
      <div class="shrink-0 border-t border-glass-border-soft p-3">
        <button
          type="button"
          (click)="logout()"
          class="flex w-full items-center justify-center gap-2 rounded-xl border border-glass-border-soft px-3 py-2.5 text-sm font-medium text-text-muted transition-colors hover:bg-glass-fill hover:text-text-primary focus-visible:outline-2 focus-visible:outline-accent-1"
        >
          <iconify-icon
            icon="lucide:log-out"
            width="18"
            height="18"
            aria-hidden="true"
          />
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main layout -->
    <div class="flex min-w-0 flex-1 flex-col">
      <!-- Header -->
      <header
        class="sticky top-0 z-[90] flex h-16 shrink-0 items-center justify-between gap-4 border-b border-glass-border-soft bg-bg-elev/90 px-4 backdrop-blur-xl sm:px-6"
      >
        <div class="flex min-w-0 items-center gap-3">
          <!-- Mobile menu -->
          <button
            type="button"
            class="rounded-xl border border-glass-border-soft bg-glass-fill px-2.5 py-2 text-text-muted transition hover:text-text-primary focus-visible:outline-2 focus-visible:outline-accent-1 lg:hidden"
            aria-label="Open navigation"
            aria-controls="dashboard-sidebar"
            [attr.aria-expanded]="mobileMenuOpen"
            (click)="openMobileMenu()"
          >
            <iconify-icon
              [attr.icon]="
                mobileMenuOpen ? 'lucide:x' : 'lucide:menu'
              "
              width="20"
              height="20"
              aria-hidden="true"
            />
          </button>

          <div class="min-w-0">
            <h2 class="text-sm font-semibold text-text-primary">
              Dashboard
            </h2>
            <p class="hidden truncate text-xs text-text-muted sm:block">
              Manage your portfolio
            </p>
          </div>
        </div>

        <!-- Header actions -->
        <div class="flex shrink-0 items-center gap-2">
          <lib-theme />
        </div>
      </header>

      <!-- Routed page content -->
      <main class="min-w-0 flex-1 p-4 sm:p-6 lg:p-8">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
