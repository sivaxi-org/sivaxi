
<div class="space-y-5">

  <!-- Header -->
  <div>
    <h3 class="text-lg font-semibold text-text-primary">
      {{ editMode ? 'Edit Testimonial' : 'Add Testimonial' }}
    </h3>

    <p class="mt-1 text-sm text-text-muted">
      {{ editMode
        ? 'Update the testimonial details.'
        : 'Add a testimonial to your portfolio.'
      }}
    </p>
  </div>


  <div class="space-y-4">

    <!-- Author Name -->
    <div>
      <label
        for="testimonial-author-name"
        class="mb-1.5 block text-sm font-medium text-text-primary"
      >
        Author Name
      </label>

      <input
        id="testimonial-author-name"
        type="text"
        maxlength="150"
        [value]="authorName()"
        (input)="authorName.set($any($event.target).value)"
        placeholder="John Doe"
        class="w-full rounded-lg border border-glass-border-soft bg-glass-fill px-3 py-2.5 text-sm text-text-primary outline-none transition focus:border-accent-1"
      />
    </div>


    <!-- Author Role -->
    <div>
      <label
        for="testimonial-author-role"
        class="mb-1.5 block text-sm font-medium text-text-primary"
      >
        Author Role
      </label>

      <input
        id="testimonial-author-role"
        type="text"
        maxlength="150"
        [value]="authorRole()"
        (input)="authorRole.set($any($event.target).value)"
        placeholder="Senior Software Engineer"
        class="w-full rounded-lg border border-glass-border-soft bg-glass-fill px-3 py-2.5 text-sm text-text-primary outline-none transition focus:border-accent-1"
      />
    </div>


    <!-- Avatar URL -->
    <div>
      <label
        for="testimonial-avatar-url"
        class="mb-1.5 block text-sm font-medium text-text-primary"
      >
        Avatar URL
      </label>

      <input
        id="testimonial-avatar-url"
        type="url"
        maxlength="500"
        [value]="authorAvatarUrl()"
        (input)="authorAvatarUrl.set($any($event.target).value)"
        placeholder="https://example.com/avatar.jpg"
        class="w-full rounded-lg border border-glass-border-soft bg-glass-fill px-3 py-2.5 text-sm text-text-primary outline-none transition focus:border-accent-1"
      />
    </div>


    <!-- Content -->
    <div>
      <label
        for="testimonial-content"
        class="mb-1.5 block text-sm font-medium text-text-primary"
      >
        Testimonial
      </label>

      <textarea
        id="testimonial-content"
        rows="6"
        [value]="content()"
        (input)="content.set($any($event.target).value)"
        placeholder="Write the testimonial..."
        class="w-full resize-y rounded-lg border border-glass-border-soft bg-glass-fill px-3 py-2.5 text-sm leading-6 text-text-primary outline-none transition focus:border-accent-1"
      ></textarea>
    </div>


    <!-- Sort Order -->
    <div>
      <label
        for="testimonial-sort-order"
        class="mb-1.5 block text-sm font-medium text-text-primary"
      >
        Sort Order
      </label>

      <input
        id="testimonial-sort-order"
        type="number"
        min="0"
        [value]="sortOrder()"
        (input)="sortOrder.set(+$any($event.target).value)"
        class="w-full rounded-lg border border-glass-border-soft bg-glass-fill px-3 py-2.5 text-sm text-text-primary outline-none transition focus:border-accent-1"
      />
    </div>


    <!-- Featured -->
    <label class="flex cursor-pointer items-center gap-3">
      <input
        type="checkbox"
        [checked]="featured()"
        (change)="featured.set($any($event.target).checked)"
        class="h-4 w-4"
      />

      <span class="text-sm text-text-primary">
        Featured
      </span>
    </label>


    <!-- Visible -->
    <label class="flex cursor-pointer items-center gap-3">
      <input
        type="checkbox"
        [checked]="visible()"
        (change)="visible.set($any($event.target).checked)"
        class="h-4 w-4"
      />

      <span class="text-sm text-text-primary">
        Visible
      </span>
    </label>

  </div>


  <!-- Actions -->
  <div
    class="flex items-center justify-end gap-3 border-t border-glass-border-soft pt-4"
  >

    <button
      type="button"
      (click)="cancel()"
      class="rounded-lg border border-glass-border-soft px-4 py-2 text-sm text-text-muted transition hover:text-text-primary"
    >
      Cancel
    </button>

    <button
      type="button"
      (click)="submit()"
      class="rounded-lg bg-accent-1 px-4 py-2 text-sm font-medium text-on-accent transition hover:opacity-90"
    >
      {{ editMode ? 'Update' : 'Add' }}
    </button>

  </div>

</div>
