<div class="w-full px-4 pt-20">
  @if (projects().length > 0) {
    <div  class="mx-auto grid w-full max-w-6xl gap-5 md:grid-cols-2">
      @for (project of projects(); track project.id) {
        <div

         (click)="projectDetails(project.slug)"  class="rounded-2xl border border-glass-border-soft bg-glass-fill p-5"
        >
          @if (project.thumbnailUrl) {
            <img
              [src]="project.thumbnailUrl"
              [alt]="project.title"
              class="mb-4 h-40 w-full rounded-xl object-cover"
            />
          }

          <div class="flex items-start justify-between gap-4">
            <div>
              <h2 class="font-semibold text-text-primary">
                {{ project.title }}
              </h2>

              <p class="mt-1 text-xs text-text-faint">
                /{{ project.slug }}
              </p>
            </div>

            @if (project.featured) {
              <span
                class="rounded-md border border-glass-border-soft bg-glass-fill-strong px-2 py-1 text-[10px] uppercase tracking-wider text-accent-2"
              >
                Featured
              </span>
            }
          </div>

          @if (project.summary) {
            <p class="mt-3 text-sm leading-6 text-text-muted">
              {{ project.summary }}
            </p>
          }

          <div class="mt-5 flex items-center justify-between">
            <span
              class="text-xs"
              [class.text-accent-2]="project.visible"
              [class.text-text-faint]="!project.visible"
            >
              {{ project.visible ? 'Visible' : 'Hidden' }}
            </span>

            <div class="flex flex-wrap gap-2">
              <!-- actions -->
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
