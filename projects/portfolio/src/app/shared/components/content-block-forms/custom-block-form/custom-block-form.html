<div
  class="rounded-2xl border border-glass-border bg-glass-fill p-6 shadow-glass"
>

  <div class="mb-6">

    <p
      class="text-xs font-medium uppercase tracking-wider text-accent-2"
    >
      New Block
    </p>

    <h2 class="mt-2 text-xl font-semibold text-text-primary">
      Custom Block
    </h2>

    <p class="mt-1 text-sm text-text-muted">
      Add custom structured JSON data.
    </p>

  </div>


  <div>

    <label
      for="custom-json"
      class="mb-2 block text-sm font-medium text-text-primary"
    >
      JSON Data
    </label>

    <textarea
      id="custom-json"
      rows="12"
      [value]="json()"
      (input)="updateJson($any($event.target).value)"
      spellcheck="false"
      class="w-full resize-y rounded-xl border border-glass-border-soft bg-glass-fill px-4 py-3 font-mono text-sm leading-6 text-text-primary outline-none placeholder:text-text-faint focus:border-accent-1"
    ></textarea>

  </div>


  <div class="mt-6 flex justify-end gap-3">

    <button
      type="button"
      (click)="cancel()"
      class="rounded-lg border border-glass-border-soft px-4 py-2 text-sm text-text-muted transition hover:bg-glass-fill-strong hover:text-text-primary"
    >
      Cancel
    </button>


    <button
      type="button"
      (click)="submit()"
      class="rounded-lg bg-accent-1 px-4 py-2 text-sm font-medium text-on-accent transition hover:opacity-90"
    >
      Add Custom Block
    </button>

  </div>

</div>
