<div class="min-w-0 max-w-full overflow-hidden rounded-2xl border border-glass-border bg-glass-fill p-6 shadow-glass">

  <div class="mb-6">

    <p class="text-xs font-medium uppercase tracking-wider text-accent-2">
      New Block
    </p>

    <h2 class="mt-2 text-xl font-semibold text-text-primary break-words">
      Image Block
    </h2>

    <p class="mt-1 break-words text-sm text-text-muted">
      Add an image using its URL.
    </p>

  </div>

  <div class="min-w-0 space-y-5">

    <div class="min-w-0">

      <label
        for="image-url"
        class="mb-2 block text-sm font-medium text-text-primary"
      >
        Image URL
      </label>

      <textarea
        id="image-url"
        rows="3"
        [value]="url()"
        (input)="updateUrl($any($event.target).value)"
        placeholder="https://example.com/image.jpg"
        class="box-border block min-h-[88px] w-full max-w-full min-w-0 resize-y rounded-xl border border-glass-border-soft bg-glass-fill px-4 py-3 text-sm leading-6 text-text-primary outline-none placeholder:text-text-faint focus:border-accent-1"
      ></textarea>

    </div>

    <div class="min-w-0">

      <label
        for="image-alt"
        class="mb-2 block text-sm font-medium text-text-primary"
      >
        Alt Text
      </label>

      <textarea
        id="image-alt"
        rows="3"
        [value]="alt()"
        (input)="updateAlt($any($event.target).value)"
        placeholder="Describe the image..."
        class="box-border block min-h-[88px] w-full max-w-full min-w-0 resize-y rounded-xl border border-glass-border-soft bg-glass-fill px-4 py-3 text-sm leading-6 text-text-primary outline-none placeholder:text-text-faint focus:border-accent-1"
      ></textarea>

    </div>

  </div>

  <div class="mt-6 flex flex-wrap justify-end gap-3">

    <button
      type="button"
      (click)="cancel()"
      class="shrink-0 rounded-lg border border-glass-border-soft px-4 py-2 text-sm text-text-muted hover:bg-glass-fill-strong"
    >
      Cancel
    </button>

    <button
      type="button"
      (click)="submit()"
      [disabled]="!url().trim() || !alt().trim()"
      class="shrink-0 rounded-lg bg-accent-1 px-4 py-2 text-sm font-medium text-on-accent hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-40"
    >
      Add Image
    </button>

  </div>

</div>
