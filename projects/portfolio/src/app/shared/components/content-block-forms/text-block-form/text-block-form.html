<div class="min-w-0 max-w-full overflow-hidden rounded-2xl border border-glass-border bg-glass-fill p-6 shadow-glass">

  <div class="mb-6">

    <p class="text-xs font-medium uppercase tracking-wider text-accent-2">
      {{ data() ? 'Edit Block' : 'New Block' }}
    </p>

    <h2 class="mt-2 text-xl font-semibold text-text-primary">
      Text Block
    </h2>

    <p class="mt-1 text-sm text-text-muted break-words">
      {{ data()
        ? 'Update the text content of this block.'
        : 'Add simple text content to this section.'
      }}
    </p>

  </div>

  <div class="min-w-0 max-w-full">

    <label
      for="text-content"
      class="mb-2 block text-sm font-medium text-text-primary"
    >
      Content
    </label>

    <textarea
      id="text-content"
      rows="6"
      [value]="content()"
      (input)="updateContent($any($event.target).value)"
      placeholder="Enter your text..."
      class="box-border block w-full max-w-full resize-y whitespace-pre-wrap break-words overflow-x-hidden rounded-xl border border-glass-border-soft bg-glass-fill px-4 py-3 text-sm leading-6 text-text-primary outline-none transition placeholder:text-text-faint focus:border-accent-1"
    ></textarea>

  </div>

  <div class="mt-6 flex flex-wrap justify-end gap-3">

    <button
      type="button"
      (click)="cancel()"
      class="rounded-lg border border-glass-border-soft px-4 py-2 text-sm text-text-muted transition hover:bg-glass-fill-strong hover:text-text-primary"
    >
      Cancel
    </button>

    <button
      type="button"
      (click)="submit()"
      [disabled]="!content().trim()"
      class="rounded-lg bg-accent-1 px-4 py-2 text-sm font-medium text-on-accent transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-40"
    >
      {{ data() ? 'Update Text Block' : 'Add Text Block' }}
    </button>

  </div>

</div>
