<div class="w-full min-w-0">
<div class="mb-4 text-xs font-medium uppercase tracking-wider text-accent-2">
  {{ data().title }}
</div>

<ul class="space-y-2">
  @for (item of data().items; track $index) {
    <li class="flex gap-2 text-sm leading-6 text-text-muted">
      <span class="shrink-0 text-accent-2">•</span>

      <text-line-clamp
        class="min-w-0 flex-1"
        [text]="item"
        [clamp]="5"
        [buttonName]="'Show more'"
        [buttonColor]="'var(--accent-2)'"
      />
    </li>
  }
</ul>

</div>
