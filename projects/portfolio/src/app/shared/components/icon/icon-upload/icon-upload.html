<div class="p-6">

  <div class="flex flex-col gap-4">

    <div>

      <label class="mb-2 block text-sm font-medium text-gray-700">
        Upload an SVG file
      </label>

      <input
        type="file"
        accept=".svg,image/svg+xml"
        (change)="onFileSelected($event)"
        class="block w-full text-sm text-gray-600
               file:mr-4 file:rounded-lg file:border-0
               file:bg-gray-900 file:px-4 file:py-2.5
               file:text-sm file:font-medium file:text-white
               hover:file:bg-gray-700"
      />

    </div>

    <div class="flex items-center gap-3 text-xs text-gray-400">
      <div class="h-px flex-1 bg-gray-200"></div>
      or paste SVG markup
      <div class="h-px flex-1 bg-gray-200"></div>
    </div>

    <textarea
      rows="6"
      [value]="rawInput()"
      (input)="onPaste($event)"
      placeholder='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">...</svg>'
      class="w-full rounded-lg border border-gray-300 px-4 py-3
             font-mono text-xs text-gray-700 outline-none
             focus:border-gray-500 focus:ring-2 focus:ring-gray-200"
    ></textarea>

    @if (error()) {

      <div class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-600">
        {{ error() }}
      </div>

    }

    @if (preview(); as svg) {

      <div class="flex items-center justify-between rounded-lg border border-gray-200 bg-gray-50 p-4">

        <div class="flex items-center gap-3">
          <app-icon [svg]="svg" sizeClass="h-10 w-10" colorClass="text-gray-700" />
          <span class="text-sm text-gray-600">Looks good</span>
        </div>

        <button
          type="button"
          (click)="useIcon()"
          class="rounded-lg bg-gray-900 px-5 py-2 text-sm font-medium
                 text-white transition hover:bg-gray-700"
        >
          Use this icon
        </button>

      </div>

    }

  </div>

  <p class="mt-4 text-xs text-gray-400">
    Final validation still happens on the server when this is saved.
  </p>

</div>
