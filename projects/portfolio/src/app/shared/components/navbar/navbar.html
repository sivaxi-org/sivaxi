<header class="fixed left-0 right-0 top-6 z-50 isolate  w-full px-4 sm:px-6 lg:px-8">
  <div
    class="glass-panel mx-auto max-w-6xl rounded-2xl border border-glass-border-soft bg-glass-fill py-2 backdrop-blur-sm backdrop-saturate-[1.4] md:py-3"
  >
    <div class="flex items-center justify-between px-4 sm:px-6">
      <a
        routerLink="/"
        class="flex shrink-0 items-center gap-2.5"
        aria-label="Home"
        (click)="closeMenu()"
      >
        <img
          [src]="
            themeService.isDark()
              ? branding().logos.primaryHorizontalLight
              : branding().logos.primaryHorizontalDark
          "
          alt="Logo"
          class="h-8 w-auto object-contain"
        />
      </a>

      <nav class="hidden items-center gap-2 md:flex" aria-label="Primary navigation">
        @for (link of navLinks; track link.fragment) {
          <a
            [href]="'#' + link.fragment"
            class="rounded-lg px-3.5 py-2 text-[0.88rem] text-text-muted transition-colors hover:bg-glass-fill-strong hover:text-text-primary"
            (click)="goToSection(link.fragment, $event)"
          >
            {{ link.label }}
          </a>
        }
      </nav>
      
      <div class="flex items-center gap-2.5">

        <a
          routerLink="/dashboard"
          class="hidden items-center justify-center rounded-[9px] border border-glass-border bg-glass-fill-strong px-4 py-2.5 text-[0.85rem] font-medium text-text-primary transition-all hover:bg-glass-fill sm:inline-flex"
        >
          {{ authService.isAuthenticated() ? "dashboard": "login" }}
        </a>

        <a
          routerLink="/plans"
          class="hidden items-center justify-center rounded-[9px] border border-glass-border bg-glass-fill-strong px-4 py-2.5 text-[0.85rem] font-medium text-text-primary transition-all hover:bg-glass-fill sm:inline-flex"
        >
          Get Started
        </a>

        <button
  type="button"
  class="group inline-flex h-10 w-10 items-center justify-center rounded-xl border border-glass-border-soft bg-glass-fill-strong text-text-muted shadow-(--shadow-glass) backdrop-blur-[14px] transition-[color,background-color,border-color,transform] duration-200 ease-out hover:border-glass-border hover:bg-glass-fill-strong hover:text-text-primary active:scale-[0.94] focus-visible:outline-2 focus-visible:outline-accent-1 focus-visible:outline-offset-[3px] md:hidden"
  [attr.aria-expanded]="menuOpen()"
  aria-controls="mobile-menu"
  aria-label="Toggle navigation menu"
  (click)="toggleMenu(); $event.stopPropagation()"
>
  @if (!menuOpen()) {
    <iconify-icon
  icon="lucide:menu"
  class="text-text-secondary"
  width="24"
  height="24"
/>
  } @else {
    <iconify-icon
  icon="lucide:x"
  class="text-text-secondary"
  width="24"
  height="24"
/>
  }
</button>
      </div>
    </div>

    @if (menuOpen()) {
      <div id="mobile-menu" class="border-t mt-2 border-glass-border-soft px-4 pb-4 pt-2 md:hidden">
        <nav class="flex flex-col" aria-label="Mobile navigation">
          @for (link of navLinks; track link.fragment) {
            <a
              [href]="'#' + link.fragment"
              class="mobile-nav-link"
              (click)="goToSection(link.fragment, $event)"
            >
              {{ link.label }}
            </a>
          }

          <a routerLink="/dashboard" class="mobile-nav-link" (click)="closeMenu()">
            {{ authService.isAuthenticated() ? 'Dashboard' : 'Login' }}
          </a>
        </nav>

        <a
          routerLink="/plans"
          class="mt-2 flex w-full items-center justify-center rounded-[9px] border border-glass-border bg-glass-fill-strong px-4 py-2.5 text-[0.85rem] font-medium text-text-primary transition-colors hover:bg-glass-fill"
          (click)="closeMenu()"
        >
          Get Started
        </a>
      </div>
    }
  </div>
</header>
