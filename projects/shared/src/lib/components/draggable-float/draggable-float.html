
<div
  class="floating-container"
  [style.left.px]="position().x"
  [style.top.px]="position().y"
  (pointerdown)="onPointerDown($event)"
>
  <div class="floating-shell">
    <div class="floating-halo"></div>

    <div class="floating-icon">
      <ng-content></ng-content>
    </div>
  </div>
</div>
