<button
  type="button"
  class="theme-toggle"
  (click)="toggleTheme()"
  [attr.aria-label]="
    themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'
  "
  [attr.title]="
    themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'
  "
>
  @if (themeService.isDark()) {
    <iconify-icon icon="lucide:sun"></iconify-icon>
  } @else {
    <iconify-icon icon="lucide:moon"></iconify-icon>
  }
</button>
