
<ul class="mt-10 divide-y divide-border border-y border-border">
  @for (capability of capabilities; track capability.title; let i = $index) {
    <li class="grid gap-6 py-8 sm:py-10 md:grid-cols-[64px_minmax(0,0.9fr)_minmax(0,1.1fr)] md:gap-8 lg:gap-12">

      <!-- Number and visual marker -->
      <div class="flex items-center gap-3 md:block">
    
        <span class="h-px flex-1 bg-border md:hidden"></span>

        <div class="hidden h-11 w-11 items-center justify-center rounded-xl border border-border bg-surface text-accent md:flex">
          <iconify-icon
            [icon]="capability.icon"
            width="21"
            height="21"
            aria-hidden="true"
          ></iconify-icon>
        </div>
      </div>

      <!-- Capability description -->
      <div class="min-w-0">
        <div class="flex items-start gap-3 md:block">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-border bg-surface text-accent md:hidden">
            <iconify-icon
              [icon]="capability.icon"
              width="20"
              height="20"
              aria-hidden="true"
            ></iconify-icon>
          </div>

          <h3 class="text-xl font-semibold tracking-tight text-primary sm:text-2xl">
            {{ capability.title }}
          </h3>
        </div>

        <p class="mt-3 max-w-md text-sm leading-7 text-muted sm:text-base">
          {{ capability.description }}
        </p>
      </div>

      <!-- Outputs -->
      <ul class="grid gap-3 sm:grid-cols-2">
        @for (output of capability.outputs; track output.title) {
          <li class="rounded-xl border border-border bg-surface/60 p-4 transition-colors hover:border-accent/50 hover:bg-surface sm:p-5">
            <div class="flex items-start gap-3">
              <span class="mt-1 flex h-5 w-5 shrink-0 items-center justify-center rounded-md bg-accent-soft text-accent">
                <iconify-icon
                  icon="lucide:arrow-up-right"
                  width="13"
                  height="13"
                  aria-hidden="true"
                ></iconify-icon>
              </span>

              <div class="min-w-0">
                <h4 class="text-sm font-semibold text-primary sm:text-base">
                  {{ output.title }}
                </h4>

                <p class="mt-2 text-sm leading-6 text-muted">
                  {{ output.description }}
                </p>
              </div>
            </div>
          </li>
        }
      </ul>

    </li>
  }
</ul>
