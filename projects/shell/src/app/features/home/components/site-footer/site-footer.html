<footer
  id="footer"
  class="flex flex-wrap items-center justify-between gap-5 border-t border-(--sivaxi-border) px-[clamp(20px,6vw,88px)] py-7 max-[560px]:items-start max-[560px]:flex-col max-[560px]:px-[22px]"
>
  <a
    class="inline-flex items-center gap-2.75 text-(--sivaxi-text) no-underline"
    href="/"
    aria-label="Sivaxi home"
  >
    <span
      class="grid size-7.5 place-items-center rounded-[8px] bg-(--sivaxi-accent) text-base font-extrabold text-white"
    >
      S
    </span>
    <span class="text-[13px] font-extrabold tracking-[.19em]">
      SIVAXI
    </span>
  </a>

  <p class="m-0 text-[11px] text-(--sivaxi-text-muted)">
    Independent thinking. Connected technology.
  </p>

  <a
    class="text-[11px] text-(--sivaxi-text-muted) no-underline transition-colors duration-200 hover:text-(--sivaxi-text)"
    href="https://github.com/sivaxi-org/sivaxi"
    target="_blank"
    rel="noopener noreferrer"
  >
    GitHub <span aria-hidden="true">↗</span>
  </a>

  <p
    class="m-0 w-full text-[10px] text-(--sivaxi-text-muted)"
  >
    © {{ currentYear }} Sivaxi. Built with purpose.
  </p>
</footer>
