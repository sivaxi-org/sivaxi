<header
  class="flex min-h-20.5 items-center justify-between gap-7 border-b border-(--sivaxi-border) px-[clamp(20px,6vw,88px)] max-[560px]:min-h-[70px] max-[560px]:gap-3 max-[560px]:px-[18px]"
>
  <a
    class="inline-flex items-center gap-2.75 text-(--sivaxi-text) no-underline"
    href="/"
    aria-label="Sivaxi home"
  >
    <span
      class="grid size-8.75 place-items-center rounded-[10px] bg-(--sivaxi-accent) text-[21px] font-extrabold text-white max-[560px]:size-[31px]"
    >
      S
    </span>

    <span
      class="text-base font-extrabold tracking-[.19em] max-[560px]:text-[13px]"
    >
      SIVAXI
    </span>
  </a>

  <nav
    class="flex items-center gap-[clamp(18px,3vw,38px)] max-[560px]:gap-3.25"
    aria-label="Main navigation"
  >
    <a
      class="text-[13px] text-(--sivaxi-text-muted) no-underline transition-colors duration-200 hover:text-(--sivaxi-text) max-[560px]:text-[11px]"
      href="#technology"
    >
      Technology
    </a>

    <a
      class="text-[13px] text-(--sivaxi-text-muted) no-underline transition-colors duration-200 hover:text-(--sivaxi-text) max-[560px]:text-[11px]"
      href="#products"
    >
      Products
    </a>

    <a
      class="text-[13px] text-(--sivaxi-text-muted) no-underline transition-colors duration-200 hover:text-(--sivaxi-text) max-[560px]:text-[11px]"
      href="#about"
    >
      About
    </a>
  </nav>

  <a
    class="rounded-lg border border-(--sivaxi-border) px-[15px] py-[11px] text-[13px] text-(--sivaxi-text) no-underline transition-colors duration-200 hover:text-(--sivaxi-text) max-[560px]:hidden"
    href="#products"
  >
    Explore Sivaxi <span aria-hidden="true">↗</span>
  </a>
</header>
