<div class="mt-10 grid grid-cols-1 items-center gap-8 sm:mt-12 lg:mt-14 lg:grid-cols-3 lg:gap-10">
  <!-- 1/3 content -->
  @if(isEven()){
  <div class="min-w-0 lg:col-span-1">
    <app-project-content [data]="project()" />
  </div>

  <!-- 2/3 preview -->
  <div class="min-w-0 lg:col-span-2">
    <app-website-preview
      [src]="project().previewUrl"
      [title]="project().title"
      [address]="project().address"
    />
  </div>
  }@else {
  <div class="min-w-0 lg:col-span-2">
    <app-website-preview
      [src]="project().previewUrl"
      [title]="project().title"
      [address]="project().address"
    />
  </div>
  <div class="min-w-0 lg:col-span-1">
    <app-project-content [data]="project()" />
  </div>

  }
</div>
