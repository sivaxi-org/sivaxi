
<div class="mt-10 grid grid-cols-1 items-center gap-8 sm:mt-12 lg:mt-14 lg:grid-cols-3 lg:gap-10">

  <!-- Project content -->
  <div
    class="min-w-0 lg:col-span-1"
    [class.lg:order-2]="!isEven()"
  >
    <app-project-content [data]="project()" />
  </div>

  <!-- Website preview -->
  <div
    class="min-w-0 lg:col-span-2"
    [class.lg:order-1]="!isEven()"
  >
    <app-website-preview
      [src]="project().previewUrl"
      [title]="project().title"
      [address]="project().address"
    />
  </div>

</div>
