<div class="flex min-w-0 flex-col items-start">
  <div class="flex flex-wrap items-center gap-3">
    <span appPill class="px-3 py-1 text-xs font-semibold">
      {{ data().status }}
    </span>

    <span class="text-sm font-medium text-muted">
      {{ data().category }}
    </span>
  </div>

  <div class="mt-6 space-y-4">
    <h2
      class="text-3xl font-semibold leading-tight tracking-tight text-primary sm:text-4xl"
    >
      {{ data().title }}
      @if (data().highlight) {
        <span class="text-accent">{{ data().highlight }}</span>
      }
    </h2>

    <p class="text-base leading-7 text-muted sm:text-lg sm:leading-8">
      {{ data().description }}
    </p>
  </div>

  <a
    appButton
    [href]="data().link"
    target="_blank"
    rel="noopener noreferrer"
    class="mt-7 w-full bg-accent text-white hover:brightness-110 sm:w-auto"
  >
    {{ data().linkLabel }}

    <iconify-icon
      icon="lucide:arrow-up-right"
      width="18"
      height="18"
      aria-hidden="true"
    ></iconify-icon>
  </a>

  <div
    class="mt-8 flex flex-wrap gap-x-4 gap-y-3 border-t border-border pt-5 text-sm text-muted"
  >
    @for (tech of data().technologies; track tech.label) {
      <span class="inline-flex items-center gap-2">
        <iconify-icon
          [attr.icon]="tech.icon"
          width="17"
          height="17"
          aria-hidden="true"
        ></iconify-icon>
        {{ tech.label }}
      </span>
    }
  </div>
</div>
