<div class="min-w-0">
  <div
    class="overflow-hidden rounded-2xl border border-border bg-surface shadow-2xl shadow-black/10"
  >
    <!-- Browser header -->
    <div class="flex h-12 items-center gap-3 border-b border-border bg-bg px-3 sm:px-4">
      <div class="flex shrink-0 items-center gap-1.5" aria-hidden="true">
        <span class="h-2.5 w-2.5 rounded-full bg-red-400/80"></span>
        <span class="h-2.5 w-2.5 rounded-full bg-yellow-400/80"></span>
        <span class="h-2.5 w-2.5 rounded-full bg-green-400/80"></span>
      </div>

      <div
        class="flex min-w-0 flex-1 items-center gap-2 rounded-lg border border-border bg-surface px-3 py-1.5"
      >
        <iconify-icon
          icon="lucide:lock-keyhole"
          width="13"
          height="13"
          class="shrink-0 text-muted"
          aria-hidden="true"
        ></iconify-icon>

        <span class="truncate text-xs text-muted">
          {{   address() || src() }}
        </span>
      </div>

      <a
        [href]="src()"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open website in a new tab"
        class="shrink-0 text-muted transition-colors hover:text-accent"
      >
        <iconify-icon
          icon="lucide:external-link"
          width="17"
          height="17"
          aria-hidden="true"
        ></iconify-icon>
      </a>
    </div>

    <!-- Website -->
    <div class="relative bg-bg" [class]="heightClass()">
      <iframe
        [src]="safeSrc()"
        [title]="title()"
        class="absolute inset-0 h-full w-full border-0 bg-bg"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </div>

  <p class="mt-3 text-right text-xs text-muted">
    Live preview ·
    <a [href]="src()" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline">
      Open full site
    </a>
  </p>
</div>
