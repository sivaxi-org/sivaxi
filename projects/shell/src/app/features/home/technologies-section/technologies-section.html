<div class="mt-12 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:mt-16 lg:grid-cols-3">
  @for (group of technologies; track group.title) {
    <article
      class="rounded-2xl border border-border bg-surface p-6 transition-colors hover:border-accent/50 sm:p-7"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-xl bg-accent-soft text-accent"
        >
          <iconify-icon
            [icon]="group.icon"
            width="22"
            height="22"
            aria-hidden="true"
          ></iconify-icon>
        </div>

        <div>
          <h3 class="font-semibold text-primary">
            {{ group.title }}
          </h3>
          <p class="mt-0.5 text-sm text-muted">
            {{ group.subtitle }}
          </p>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap gap-2">
        @for (technology of group.technologies; track technology) {
          <span appPill>{{ technology }}</span>
        }
      </div>
    </article>
  }
</div>
