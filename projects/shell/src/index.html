<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sivaxi | SaaS Products &amp; Custom Software Development</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Sivaxi builds SaaS products and delivers custom software development services. Explore AI assistants, agentic AI, web applications, backend systems, API integrations, cloud solutions, and scalable software engineering."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Sivaxi" />
    <meta name="theme-color" content="#111318" />
    <meta name="application-name" content="Sivaxi" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://sivaxi.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sivaxi" />
    <meta
      property="og:title"
      content="Sivaxi | SaaS Products &amp; Custom Software Development"
    />
    <meta
      property="og:description"
      content="Building SaaS products and delivering custom software solutions in AI, web development, backend engineering, API integration, and cloud infrastructure."
    />
    <meta property="og:url" content="https://sivaxi.com/" />
    <meta property="og:locale" content="en_IN" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Sivaxi | SaaS Products &amp; Custom Software Development"
    />
    <meta
      name="twitter:description"
      content="Explore Sivaxi's SaaS products, AI solutions, and custom software development services."
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sivaxi",
        "url": "https://sivaxi.com/",
        "description": "Sivaxi builds SaaS products and provides custom software development services, including AI solutions, web applications, backend systems, API integrations, and cloud engineering."
      }
    </script>

    <!-- Preserve the existing theme initialization -->
    <script>
      (() => {
        const match = document.cookie.match(
          /(?:^|;\s*)sivaxi-theme=(dark|light)(?:;|$)/
        );

        const theme = match ? match[1] : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
