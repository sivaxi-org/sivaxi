
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sivaxi — Independent Technology Brand</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Root domain SEO -->
    <meta
      name="description"
      content="Sivaxi is an independent technology brand focused on building software products and practical digital solutions through thoughtful engineering."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Sivaxi" />
    <meta name="theme-color" content="#111318" />
    <meta name="application-name" content="Sivaxi" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://sivaxi.com/" />

    <!-- Theme-aware favicon -->
    <link
      id="app-favicon"
      rel="icon"
      type="image/x-icon"
      href="primary_icon_dark.ico"
    />

    <!-- Open Graph: Root domain -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sivaxi" />
    <meta
      property="og:title"
      content="Sivaxi — Independent Technology Brand"
    />
    <meta
      property="og:description"
      content="Discover Sivaxi, an independent technology brand creating software products and practical digital solutions."
    />
    <meta property="og:url" content="https://sivaxi.com/" />
    <meta property="og:locale" content="en_IN" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Sivaxi — Independent Technology Brand"
    />
    <meta
      name="twitter:description"
      content="Sivaxi builds software products and digital solutions through thoughtful engineering."
    />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sivaxi",
        "url": "https://sivaxi.com/",
        "description": "An independent technology brand focused on software products and digital solutions."
      }
    </script>

    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

    <!-- Initialize theme and favicon before Angular renders -->
    <script>
      (() => {
        const match = document.cookie.match(
          /(?:^|;\s*)sivaxi-theme=(dark|light)(?:;|$)/
        );

        const theme = match ? match[1] : 'dark';

        document.documentElement.setAttribute('data-theme', theme);

        const favicon = document.getElementById('app-favicon');

        if (favicon) {
          favicon.href =
            theme === 'dark'
              ? 'primary_icon_dark.ico'
              : 'primary_icon_light.ico';
        }

        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute(
            'content',
            theme === 'dark' ? '#111318' : '#F4F2ED'
          );
      })();
    </script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
